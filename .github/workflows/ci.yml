name: Slancio CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Download repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt
        pip install aiosqlite

    - name: Health Check
      run: |
        cd infra
        cat <<EOF > .env
        DATABASE_URL=sqlite+aiosqlite:///:memory:
        SUPABASE_URL=https://mock.supabase.co
        WEBHOOK_SECRET=mock_whsec
        API_KEY=mock_api_key
        QSTASH_TOKEN=mock_token
        QSTASH_CURRENT_SIGNING_KEY=mock_curr
        QSTASH_NEXT_SIGNING_KEY=mock_next
        PUBLIC_API_URL=https://mock.railway.app
        SHOPIFY_WEBHOOK_SECRET=mock_shopify
        TIENDANUBE_WEBHOOK_SECRET=mock_tiendanube
        EOF
        docker compose up -d
        sleep 5
        docker compose logs api
        curl --retry 5 --retry-delay 2 --retry-all-errors --fail -s http://localhost:8000/health
        echo "API Healthy"
        
    - name: Run Tests
      env:
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        SUPABASE_URL: https://mock.supabase.co
        WEBHOOK_SECRET: mock_whsec
        API_KEY: mock_api_key
        QSTASH_TOKEN: mock_token
        QSTASH_CURRENT_SIGNING_KEY: mock_curr
        QSTASH_NEXT_SIGNING_KEY: mock_next
        PUBLIC_API_URL: https://mock.railway.app
        SHOPIFY_WEBHOOK_SECRET: mock_shopify
        TIENDANUBE_WEBHOOK_SECRET: mock_tiendanube
      run: |
        PYTHONPATH=. python -m pytest core/tests/ -v